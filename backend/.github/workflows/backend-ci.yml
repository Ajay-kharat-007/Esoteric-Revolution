name: backend-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          { POSTGRES_DB: esoteric_test, POSTGRES_USER: esoteric, POSTGRES_PASSWORD: test_password }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U esoteric -d esoteric_test" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://esoteric:test_password@localhost:5432/esoteric_test?schema=public
      DIRECT_DATABASE_URL: postgresql://esoteric:test_password@localhost:5432/esoteric_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.11.1, cache: npm }
      - run: npm ci
      - run: npm run prisma:migrate:deploy
      - run: npm run prisma:seed
      - run: npm run quality
      - run: docker build --target production -t esoteric-library-backend:${{ github.sha }} .
