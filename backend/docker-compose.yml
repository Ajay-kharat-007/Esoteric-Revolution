services:
  postgres:
    image: postgres:16.4-alpine
    container_name: esoteric-postgres
    environment:
      {
        POSTGRES_DB: esoteric_library,
        POSTGRES_USER: esoteric_admin,
        POSTGRES_PASSWORD: esoteric_local_only,
      }
    ports: ['5432:5432']
    volumes: [esoteric_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U esoteric_admin -d esoteric_library'],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
  redis:
    image: redis:7.4-alpine
    container_name: esoteric-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6380:6379']
    volumes: [esoteric_redis_data:/data]
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: { context: ., target: development }
    env_file: .env
    ports: ['3000:3000']
    volumes: ['.:/app', api_node_modules:/app/node_modules]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    command: npm run start:dev
volumes: { esoteric_postgres_data: {}, esoteric_redis_data: {}, api_node_modules: {} }
